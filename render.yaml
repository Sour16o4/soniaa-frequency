# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: soniaa-frequency
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/pulse
    envVars:
      - key: NODE_VERSION
        value: "24"            # node:sqlite is built in from Node 22.13
      - key: ADMIN_KEY
        generateValue: true    # Soniaa's inbox: /api/admin?key=<this value>, shown in Render's Environment tab
